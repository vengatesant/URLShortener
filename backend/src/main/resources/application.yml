server:
  port: 8080

spring:
  application:
    name: url-shortener-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/urlshortener
    username: urlshortener
    password: urlshortener
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  cache:
    ttl-seconds: 300
    max-size: 10000
  rate-limit:
    requests-per-minute: 20
  reserved-aliases: api,r,admin,static,assets,health,actuator,login,logout,www,app

logging:
  level:
    com.urlshortener: INFO
